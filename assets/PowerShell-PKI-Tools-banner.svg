<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="1280" height="400" fill="url(#bg)" />

  <!-- Tech Matrix Blueprint Grid -->
  <g opacity="0.12" stroke="#0284C7" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1280" height="400" fill="url(#grid)" />
  </g>

  <!-- High-Tech Data Stream Vectors -->
  <g opacity="0.25">
    <path d="M -50 100 Q 300 60 640 180 T 1330 220" fill="none" stroke="#0284C7" stroke-width="2" />
    <path d="M -50 280 Q 400 340 780 240 T 1330 140" fill="none" stroke="#10B981" stroke-width="2" />
  </g>

  <!-- Left: Hero Graphic Emblematics -->
  <g transform="translate(180, 200)">
    <!-- Concentric Orbit Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="30 15 60 15" opacity="0.7" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#10B981" stroke-width="2" opacity="0.6" />
    
    <!-- Outer Spoke Nodes -->
    <circle cx="0" cy="-140" r="10" fill="#0B0F19" stroke="#0284C7" stroke-width="3" />
    <circle cx="140" cy="0" r="10" fill="#0B0F19" stroke="#10B981" stroke-width="3" />
    <circle cx="0" cy="140" r="10" fill="#0B0F19" stroke="#F59E0B" stroke-width="3" />
    <circle cx="-140" cy="0" r="10" fill="#0B0F19" stroke="#0284C7" stroke-width="3" />

    <!-- Central Iconography Transformed -->
    <g transform="translate(-256, -256)">

    <!-- X.509 Certificate & Cryptographic Seal Motif -->
    <!-- Certificate Parchment Sheet -->
    <rect x="176" y="145" width="160" height="210" rx="10" fill="#0B0F19" stroke="#0284C7" stroke-width="5" />
    <!-- Certificate Header Bar -->
    <line x1="200" y1="180" x2="312" y2="180" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
    <!-- Subject / Public Key Details Lines -->
    <line x1="200" y1="205" x2="280" y2="205" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
    <line x1="200" y1="225" x2="295" y2="225" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
    <line x1="200" y1="245" x2="265" y2="245" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
    <!-- Cryptographic Wax Seal & Ribbons -->
    <circle cx="256" cy="295" r="24" fill="#0F172A" stroke="#F59E0B" stroke-width="4" />
    <circle cx="256" cy="295" r="14" fill="#F59E0B" opacity="0.85" />
    <path d="M 246 315 L 240 345 L 252 335 L 260 345 L 256 317" fill="#F59E0B" />
    <!-- Keyhole / Trust Check in Seal -->
    <circle cx="256" cy="292" r="4" fill="#FFFFFF" />
    <line x1="256" y1="294" x2="256" y2="301" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
        
    </g>
  </g>

  <!-- Right: Typography & Capability Badges -->
  <g transform="translate(420, 100)">
    <!-- Overline Category Capsule -->
    <rect x="0" y="0" width="280" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#0284C7" filter="url(#glow)" />
    <text x="28" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">KOALITY-ASSURED • PKI AS CODE</text>

    <!-- Project Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="1">POWERSHELL PKI TOOLS</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Declarative Multi-Tier ADCS PKI as Code, NDES with gMSA, CSR Validation &amp; Trust Distribution</text>

    <!-- Capability Chips -->
    <g transform="translate(0, 150)">
      <!-- Chip 1: Multi-Tier DSC CAs -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="210" height="38" rx="8" fill="#111827" stroke="#0284C7" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#0284C7" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Multi-Tier DSC CAs</text>
      </g>
      <!-- Chip 2: Offline Root CA -->
      <g transform="translate(224, 0)">
        <rect x="0" y="0" width="183" height="38" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#10B981" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Offline Root CA</text>
      </g>
      <!-- Chip 3: NDES with gMSA -->
      <g transform="translate(421, 0)">
        <rect x="0" y="0" width="174" height="38" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#F59E0B" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">NDES with gMSA</text>
      </g>
      <!-- Chip 4: PKCS#10 &amp; TLS Probe -->
      <g transform="translate(609, 0)">
        <rect x="0" y="0" width="219" height="38" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#38BDF8" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">PKCS#10 &amp; TLS Probe</text>
      </g>
    </g>
  </g>
</svg>
