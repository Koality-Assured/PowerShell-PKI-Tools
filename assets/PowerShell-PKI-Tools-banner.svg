<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)" />

  <g opacity="0.12" stroke="#0284C7" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1280" height="400" fill="url(#grid)" />
  </g>

  <g opacity="0.25">
    <path d="M -50 120 Q 350 40 640 180 T 1330 200" fill="none" stroke="#0284C7" stroke-width="2" />
    <path d="M -50 260 Q 420 320 780 220 T 1330 150" fill="none" stroke="#10B981" stroke-width="2" />
  </g>

  <g transform="translate(180, 200)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="30 15 60 15" opacity="0.7" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#10B981" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="-140" r="10" fill="#0B0F19" stroke="#0284C7" stroke-width="3" />
    <circle cx="140" cy="0" r="10" fill="#0B0F19" stroke="#10B981" stroke-width="3" />
    <circle cx="0" cy="140" r="10" fill="#0B0F19" stroke="#F59E0B" stroke-width="3" />
    <circle cx="-140" cy="0" r="10" fill="#0B0F19" stroke="#0284C7" stroke-width="3" />
    <g transform="translate(-40, -45)" filter="url(#glow)">
      
        <!-- Certificate Document Motif -->
        <rect x="10" y="5" width="60" height="80" rx="4" fill="#1E293B" stroke="#0284C7" stroke-width="2" />
        <line x1="20" y1="20" x2="60" y2="20" stroke="#10B981" stroke-width="2" />
        <line x1="20" y1="30" x2="60" y2="30" stroke="#64748B" stroke-width="1.5" />
        <line x1="20" y1="40" x2="50" y2="40" stroke="#64748B" stroke-width="1.5" />
        <line x1="20" y1="50" x2="55" y2="50" stroke="#64748B" stroke-width="1.5" />
        <!-- Gold Ribbon / Seal -->
        <circle cx="50" cy="65" r="10" fill="#F59E0B" />
        <polygon points="46,73 50,83 54,73" fill="#D97706" />
        
    </g>
  </g>

  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="350" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#0284C7" filter="url(#glow)" />
    <text x="28" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">KOALITY-ASSURED • PKI AS CODE</text>

    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="1">POWERSHELL PKI TOOLS</text>

    <text x="0" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Declarative Multi-Tier ADCS PKI as Code, NDES with gMSA, CSR Validation & Trust Distribution</text>

    <g transform="translate(0, 150)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="192" height="38" rx="8" fill="#111827" stroke="#0284C7" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#0284C7" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Multi-Tier DSC CAs</text>
      </g>
      <g transform="translate(204, 0)">
        <rect x="0" y="0" width="224" height="38" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#10B981" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Offline Root Hardening</text>
      </g>
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="160" height="38" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#F59E0B" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">NDES with gMSA</text>
      </g>
      <g transform="translate(612, 0)">
        <rect x="0" y="0" width="216" height="38" rx="8" fill="#111827" stroke="#EC4899" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#EC4899" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">PKCS#10 & TLS Probing</text>
      </g>
    </g>
  </g>
</svg>