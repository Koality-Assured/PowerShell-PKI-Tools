name: PKI CI & Adversarial Security Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Adversarial Review & Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: PowerShell AST Syntax Validation
        shell: powershell
        run: |
          $psFiles = Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1
          $errorsFound = $false
          foreach ($file in $psFiles) {
              $errs = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errs)
              $realErrs = $errs | Where-Object { $_.ErrorId -ne 'ModuleNotFoundDuringParse' }
              if ($realErrs) {
                  Write-Error "Syntax error in $($file.FullName): $($realErrs.Message)"
                  $errorsFound = $true
              }
          }
          if ($errorsFound) { exit 1 }

      - name: Run PowerShell Pester Tests
        shell: powershell
        run: |
          Invoke-Pester -Path tests -Output Detailed

      - name: Run Python Test Suite
        run: |
          python -m unittest tests/test_pki_framework.py -v

      - name: Run Antagonistic Security Audit
        run: |
          python adversarial_review.py
